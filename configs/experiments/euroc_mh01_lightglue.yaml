  max_pairs: 500
outputs:
  run_dir: runs/euroc_mh01_lightglue
  matches_csv: runs/euroc_mh01_lightglue/matches.csv
  vins_tracks_csv: runs/euroc_mh01_lightglue/vins_tracks.csv
